<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Videotutoriais HTML e CSS</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 30px;
        background-color: #f2f2f2;
        color: #222;
      }

      header {
        text-align: center;
        margin-bottom: 30px;
      }

        max-width: 800px;
        margin: 0 auto;

        border-radius: 8px;
      }

        color: #0759a5;
      }

    <main>
      <section>
        <h2>1. Elementos Estruturais HTML5</h2>
        <p>

        </p>

        <iframe
          src="https://www.youtube.com/embed/0_5SFBrDBAk"
          title="Elementos Estruturais HTML5"
          allowfullscreen
        >
        </iframe>

        <p>
          <a href="videotutoriais/video1.html"
            >Consultar o código HTML do exemplo</a
          >
        </p>
      </section>

</html>
