<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
        background-color: #f2f2f2;
      }
      h1 {
        text-align: center;
        margin-bottom: 25px;
      }
      .galeria {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
      }
      .cartao {
        background-color: aqua;
        border-radius: 10px;
        padding: 30px;
        text-align: center;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
    </style>
  </head>
  <body>
    <h1>Grelha</h1>
    <div class="galeria">
      <div class="cartao">
        <h2>Cartao 1</h2>
        <p>1</p>
      </div>
      <div class="cartao">
        <h2>Cartao 2</h2>
        <p>2</p>
        </div>
        <div class="cartao">
          <h2>Cartao 3</h2>
          <p>3</p>
        </div>
        <div class="cartao">
          <h2>Cartao 4</h2>
          <p>4</p>
        </div>
      </div>
    </div>
  </body>
</html>
