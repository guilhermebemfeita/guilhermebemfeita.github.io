<!doctype html>
<html lang="pt">
  <head>
    <style>
      .fotografias {
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        gap: 10px;
      }

      .fotografias img {
        width: 150px;
        border-radius: 20px;
      }

      .poema p:nth-child(odd) {
        color: #2c3e50;
        font-weight: bold;
      }

      .poema p:nth-child(even) {
        color: #2980b9;
        font-style: italic;
      }
    </style>

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Lisboa - Multimédia</title>

    <link rel="stylesheet" href="../styles.css" />
  </head>

  <body>
    <header>
      <h1>Lisboa</h1>

      <nav>
        <a href="index.html">Home</a>
        <a href="local.html">Localização</a>
        <a href="multimedia.html">Multimédia</a>
        <a href="info.html">Informação</a>
      </nav>
    </header>

    <main>
      <h2>Multimédia</h2>

      <p>Nesta página encontra conteúdos multimédia sobre Lisboa.</p>

      <!-- Secção de Âncoras -->
      <p>
        <a href="#fotografias">Fotografias</a> | <a href="#video">Vídeo</a> |
        <a href="#poema">Poema</a>
      </p>

      <!-- Secção de Fotografias -->
      <section>
        <h3 id="fotografias">Fotografias</h3>

        <div class="fotografias">
          <img src="images/1x1.jpeg" alt="Baixa de Lisboa" />
          <img src="images/1x2.jpeg" alt="Torre de Belém" />
          <img src="images/1x3.jpeg" alt="Praça do Comércio" />
          <img src="images/1x4.jpeg" alt="Rio Tejo" />
          <img src="images/1x5.jpeg" alt="Castelo de São Jorge" />
          <img src="images/1x6.jpeg" alt="Alfama" />
          <img src="images/1x7.jpeg" alt="Praça do Rossio" />
          <img src="images/1x8.jpeg" alt="Pastéis de nata" />
        </div>
      </section>

      <!-- Secção de Vídeo -->
      <section>
        <h3 id="video">Vídeo</h3>

        <iframe
          width="560"
          height="315"
          src="https://www.youtube.com/embed/ED9P64jN844"
          title="Lisboa"
          frameborder="0"
          allow="
            accelerometer;
            autoplay;
            clipboard-write;
            encrypted-media;
            gyroscope;
            picture-in-picture;
            web-share;
          "
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen
        ></iframe>
      </section>

      <!-- Secção de Poesia -->
      <section>
        <h3 id="poema">Poesia</h3>

        <div class="poema">
          <p>Lisboa, cidade bela,</p>
          <p>À beira do Tejo azul,</p>
          <p>És de Portugal a estrela,</p>
          <p>A brilhar de norte a sul.</p>
        </div>
      </section>
    </main>

    <footer>
      <p>DIW 2026</p>
    </footer>
  </body>
</html>
