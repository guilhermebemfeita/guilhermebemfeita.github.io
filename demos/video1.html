<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Seletores child</title>
    <style>
        h1:first-child {color:blue;}
        body > ul > li{color:red;}
        ul > ul > li:nth-child(2n) {color:purple;}
    </style>
</head>
<body>
    <h1>Azul</h1>
    <ul>
        <li>Vermelho</li>
        <li>Vermelho</li>
        <ul>
            <li>Preto</li>
            <li>Violeta</li>
            <li>Preto</li>
            <li>Violeta </li>
        </ul>
        <li>Vermelho</li>
    </ul>
    <h1>Preto</h1>
</body>
</html>
