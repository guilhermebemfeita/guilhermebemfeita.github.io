<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS flex para centrar smile</title>
    <style>
        *{
            padding:0;
            margin:0;
        }
        div{
            background-color: brown;
            height:100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        span{
            font-size: 4rem;
        }
    </style>
</head>
<body>
    <div>
        <span>🤑🤑🤑</span>
    </div>
</body>
</html>
