
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Loja online de produtos para programadores.">
    <title>Loja Online | DevStore</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>DevStore<span>.</span></h1>
        <p>Produtos para quem vive a programação.</p>
        <nav>
            <a href="#produtos">Produtos</a>
            <a href="#carrinho">Cesto de compras</a>
        </nav>
    </header>

    <main>
        <section id="produtos">
            <div class="cabecalho-produtos">
                <div>
                    <p class="etiqueta">A NOSSA COLEÇÃO</p>
                    <h2>Descobre os produtos.</h2>
                </div>
                <p>11 produtos para verdadeiros apaixonados por código.</p>
            </div>
            <div id="lista-produtos"></div>
        </section>

        <section id="carrinho">
            <p class="etiqueta">AS TUAS ESCOLHAS</p>
            <h2>Cesto de compras</h2>
            <div id="produtos-selecionados"></div>
            <p id="preco-total">Total: 0,00 €</p>
        </section>
    </main>

    <footer>
        <a class="logo" href="#">DevStore<span>.</span></a>
        <p>Feito para quem gosta de programar.</p>
    </footer>

    <script src="produtos.js"></script>
    <script src="main.js"></script>
</body>
</html>
